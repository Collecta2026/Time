services:
  - type: web
    name: time-hr
    runtime: python
    region: frankfurt          # closest Render region to Egypt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL       # paste your Neon connection string (London region)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"          # set "true" once to load demo data, then back to "false"
